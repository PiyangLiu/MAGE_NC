<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="735" viewBox="20 105 1720 735" role="img" aria-labelledby="title desc">
  <title id="title">Figure 6a — six-cell pressure-coupled ternary flow and injection stages</title>
  <desc id="desc">One-dimensional six-cell porous-medium model at 320 K, length 0.6 m,
    porosity 0.20, permeability 10 to the minus 15 square metres,
    inlet pressure 3.2 MPa, outlet 2.0 MPa, initial composition (0.04, 0.08, 0.88),
    and three injection stages. Composition order is methane, carbon dioxide and n-butane.</desc>
  <defs>
    <style>
      .type { font-family: Arial, "Helvetica Neue", "Liberation Sans", sans-serif;
              fill: #111920; }
      .strong { font-weight: 700; }
      .medium { font-weight: 600; }
      .cell { fill: #3577a8; stroke: #27343d; stroke-width: 3.5; }
      .sub { font-size: 65%; baseline-shift: sub; }
      .sup { font-size: 65%; baseline-shift: super; }
    </style>
    <marker id="flowArrow" viewBox="0 0 12 10" refX="10.8" refY="5" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#29343d" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1765" height="891" fill="#ffffff" />

  
  <g>
    <rect x="77" y="166" width="1649" height="92" fill="#edf2f5" />
    <path d="M 489 166 V 258 M 901 166 V 258 M 1313 166 V 258" fill="none" stroke="#ffffff" stroke-width="4" />
    <text class="type medium" text-anchor="middle" x="283" y="229" font-size="42" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920" font-weight="600">T = 320 K</text>
    <text class="type medium" text-anchor="middle" x="695" y="229" font-size="42" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920" font-weight="600">L = 0.6 m</text>
    <text class="type medium" text-anchor="middle" x="1107" y="229" font-size="42" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920" font-weight="600">φ = 0.20</text>
    <text class="type medium" text-anchor="middle" x="1519" y="229" font-size="42" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920" font-weight="600">K = 10⁻¹⁵ m²</text>
  </g>

  
  <text class="type strong" x="77" y="328" font-size="41" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920" font-weight="700">Initial z₀ = (0.04, 0.08, 0.88)</text>
  <text class="type medium" x="677" y="328" font-size="39" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920" font-weight="600">(CH₄ / CO₂ / n-C₄)</text>

  
  <g>
    <rect class="cell" x="398" y="370" width="969" height="115" fill="#d6e8f4" stroke="#27343d" stroke-width="3.5" />
    <path d="M 559.5 370 V 485 M 721 370 V 485 M 882.5 370 V 485              M 1044 370 V 485 M 1205.5 370 V 485" fill="none" stroke="#27343d" stroke-width="3.5" />
    <g class="type medium" font-size="46" text-anchor="middle">
      <text x="478.75" y="444" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff">1</text>
      <text x="640.25" y="444" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff">2</text>
      <text x="801.75" y="444" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff">3</text>
      <text x="963.25" y="444" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff">4</text>
      <text x="1124.75" y="444" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff">5</text>
      <text x="1286.25" y="444" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff">6</text>
    </g>
  </g>

  
  <text class="type medium" x="24" y="439" font-size="37" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920" font-weight="600">Pᵢₙ = 3.2 MPa</text>
  <line x1="297" y1="429" x2="390" y2="429" stroke="#29343d" stroke-width="4.5" marker-end="url(#flowArrow)" />
  <line x1="1369" y1="429" x2="1472" y2="429" stroke="#29343d" stroke-width="4.5" marker-end="url(#flowArrow)" />
  <text class="type medium" x="1484" y="439" font-size="36" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920" font-weight="600">Pₒᵤₜ = 2.0 MPa</text>
  <line x1="398" y1="520" x2="1368" y2="520" stroke="#29343d" stroke-width="4.5" marker-end="url(#flowArrow)" />

  
  <text class="type strong" x="77" y="601" font-size="41" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920" font-weight="700">Injection stages — zᵢₙ</text>
  <text class="type medium" x="525" y="601" font-size="39" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920" font-weight="600">(CH₄ / CO₂ / n-C₄)</text>
  <g>
    <rect x="77" y="632" width="322.2" height="122" fill="#8d949b" />
    <rect x="399.2" y="632" width="483.3" height="122" fill="#3577a8" />
    <rect x="882.5" y="632" width="805.5" height="122" fill="#cc7256" />
    <path d="M 399.2 632 V 754 M 882.5 632 V 754" fill="none" stroke="#ffffff" stroke-width="3" />
    <g class="type" text-anchor="middle">
      <text class="medium" x="238.1" y="676" font-size="33" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff" font-weight="600" text-anchor="middle">Two-phase</text>
      <text x="238.1" y="718" font-size="30" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff" text-anchor="middle">(0.15, 0.15, 0.70)</text>
      <text class="medium" x="640.85" y="676" font-size="33" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff" font-weight="600" text-anchor="middle">Liquid wash</text>
      <text x="640.85" y="718" font-size="31" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff" text-anchor="middle">(0.04, 0.08, 0.88)</text>
      <text class="medium" x="1285.25" y="676" font-size="33" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff" font-weight="600" text-anchor="middle">Vapour-rich</text>
      <text x="1285.25" y="718" font-size="32" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#ffffff" text-anchor="middle">(0.65, 0.20, 0.15)</text>
    </g>
  </g>
  <path d="M 77 754 H 1688 M 77 754 V 779 M 399.2 754 V 779            M 882.5 754 V 779 M 1688 754 V 779" fill="none" stroke="#27343d" stroke-width="2.6" />
  <g class="type" font-size="31">
    <text x="77" y="821" text-anchor="middle" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920">0</text>
    <text x="399.2" y="821" text-anchor="middle" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920">12,000</text>
    <text x="882.5" y="821" text-anchor="middle" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920">30,000</text>
    <text x="1688" y="821" text-anchor="end" font-family="DejaVu Sans,Arial,Helvetica,sans-serif" fill="#111920">60,000 s</text>
  </g>
<path d="M 367 417 L 394 429 L 367 441 Z" fill="#29343d" /><path d="M 1448 417 L 1475 429 L 1448 441 Z" fill="#29343d" /><path d="M 1342 508 L 1372 520 L 1342 532 Z" fill="#29343d" /></svg>
